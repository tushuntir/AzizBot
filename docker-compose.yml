services:
  bot:
    build: .
    container_name: reelbot
    env_file: .env
    # POT server is embedded in the image; it listens on 127.0.0.1:4416 inside the bot container.
    environment:
      POT_BASE_URL: http://127.0.0.1:4416
    restart: unless-stopped
    volumes:
      - botdata:/app/data
      - ./cookies.txt:/app/cookies.txt:ro   # uncomment if you use COOKIES_FILE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  botdata:
